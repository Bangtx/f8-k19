<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="styles.css">
  <script src="
  https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/scripts/verify.min.js

  <link href="

<body>

  <div class="card">
    <div class="card__icon">
      <span class="fa fa-gear"></span>
      <span class="mdi mdi-home"></span>
    </div>
    <div class="card__title">
      <div class="card__title__name">
        Ngon Ngu Sass
      </div>
      <div class="card__title__description">
        Danh Cho Frontend Developer
      </div>
    </div>
    <div class="card__content">
      <div class="card__content__name">
        Ngon Ngu Sass
      </div>
      <div class="card__content__price">
        <div class="card__content__price__original">400.000</div>
        <div class="card__content__price__amount">299.000</div>
      </div>
      <div class="card__content__bottom">
        <div class="card__content__bottom__owner">
          Son Dang
        </div>
        <div class="card__content__bottom__number-of-video">
          14
        </div>
        <div class="card__content__bottom__total-time">
          <span class="far fa-clock"></span>
          53h12
        </div>
      </div>
    </div>
  </div>

</html>
